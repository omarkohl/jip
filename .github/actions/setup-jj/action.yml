name: Setup jj
description: Install a pinned, checksum-verified jj (Linux x86_64) and add it to PATH.

inputs:
  version:
    description: jj version (without leading "v")
    default: "0.45.1"
  sha256:
    description: SHA-256 of the x86_64-unknown-linux-musl tarball
    default: f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72

runs:
  using: composite
  steps:
    - shell: bash
      env:
        JJ_VERSION: ${{ inputs.version }}
        JJ_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
          echo "::error::setup-jj only supports Linux X64 runners (got $RUNNER_OS $RUNNER_ARCH)"
          exit 1
        fi
        dir="$RUNNER_TOOL_CACHE/jj/$JJ_VERSION"
        mkdir -p "$dir"
        tarball="$RUNNER_TEMP/jj.tar.gz"
        curl -fsSLo "$tarball" \
          "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "$JJ_SHA256  $tarball" | sha256sum -c -
        tar -xzf "$tarball" -C "$dir" ./jj
        echo "$dir" >> "$GITHUB_PATH"
    - shell: bash
      run: jj --version
